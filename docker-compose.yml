# Main Mana Ethereum Client Development Environment
version: '3.8'

services:
  # Main Mana application
  mana:
    build: 
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: mana-app
    ports:
      - "8545:8545"  # JSON-RPC HTTP
      - "8546:8546"  # JSON-RPC WebSocket  
      - "30303:30303/tcp"  # P2P TCP
      - "30303:30303/udp"  # P2P UDP
      - "9568:9568"  # Health check
    environment:
      - MIX_ENV=dev
      - DATA_DIR=/data
      - LOG_DIR=/logs
      - DATABASE_URL=ecto://mana:mana@postgres:5432/mana_dev
    volumes:
      - mana_data:/data
      - mana_logs:/logs
      - ./config:/app/config:ro
    networks:
      - mana_network
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9568/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: mana-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mana
      - POSTGRES_PASSWORD=mana
      - POSTGRES_DB=mana_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mana_network
    restart: unless-stopped

volumes:
  mana_data:
    driver: local
  mana_logs:
    driver: local
  postgres_data:
    driver: local

networks:
  mana_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16