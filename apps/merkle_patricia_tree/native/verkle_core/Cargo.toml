[package]
name = "verkle_core"
version = "0.1.0"
edition = "2021"
authors = ["Mana Development Team"]
description = "Ultra-high performance Verkle tree operations for 35x speedup target"

[lib]
name = "verkle_core"
crate-type = ["cdylib"]

[dependencies]
# Elixir integration
rustler = "0.29"

# High-performance data structures
crossbeam = { version = "0.8", optional = true }
rayon = { version = "1.7", optional = true }
parking_lot = "0.12"
num_cpus = "1.16"

# SIMD and vectorization
wide = { version = "0.7", optional = true }

# Memory management
bumpalo = "3.13"
jemallocator = { version = "0.5", optional = true }

# Cryptography (existing)
ark-ec = "0.4"
ark-ff = "0.4"
ark-poly = "0.4"
ark-ed-on-bls12-381-bandersnatch = "0.4"
ark-serialize = "0.4"
blake3 = "1.5"

# Performance and profiling
criterion = { version = "0.5", features = ["html_reports"], optional = true }
pprof = { version = "0.11", features = ["flamegraph", "protobuf-codec"], optional = true }

# System information
sys-info = { version = "0.9", optional = true }


[features]
default = ["simd", "parallel"]
simd = ["wide"]
parallel = ["rayon", "crossbeam"]
jemalloc = ["jemallocator"]
gpu = []
profiling = ["pprof"]
sysinfo = ["sys-info"]

# Compiler optimizations for maximum performance
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

# Enable all CPU-specific optimizations
[profile.release.package."*"]
opt-level = 3

# Development profile with debugging
[profile.dev]
opt-level = 2
debug = true

# Benchmark profile
[profile.bench]
inherits = "release"
debug = true

