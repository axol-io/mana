[package]
name = "dvt_crypto"
version = "0.1.0"
edition = "2021"

[lib]
name = "dvt_crypto"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.30.0"
lazy_static = "1.4.0"
rand = "0.8"
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Cryptographic dependencies
bls12_381 = "0.8.0"
group = "0.13.0"
ff = "0.13.0"
pairing = "0.23.0"
sha2 = "0.10"
hkdf = "0.12"

# Threshold cryptography
threshold_crypto = { git = "https://github.com/poanetwork/threshold_crypto.git", rev = "5c25af1" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"