apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mana-ethereum-prod

namePrefix: prod-

resources:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml
  - hpa-patch.yaml

configMapGenerator:
  - name: mana-config
    behavior: merge
    literals:
      - NETWORK_ID=1
      - SYNC_MODE=full
      - MAX_PEERS=100
      - LOG_LEVEL=warn

secretGenerator:
  - name: mana-secrets
    behavior: merge
    envs:
      - secrets.env

replicas:
  - name: mana-ethereum
    count: 5

images:
  - name: mana-ethereum
    newName: your-registry.io/mana-ethereum
    newTag: v1.0.0-prod