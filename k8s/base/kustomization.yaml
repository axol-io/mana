apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mana-ethereum

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

commonLabels:
  app: mana-ethereum
  version: v1.0.0

images:
  - name: mana-ethereum
    newTag: latest