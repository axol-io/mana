apiVersion: v1
kind: Secret
metadata:
  name: mana-secrets
  namespace: mana-ethereum
  labels:
    app: mana-ethereum
type: Opaque
stringData:
  # These should be replaced with actual values using sealed-secrets or external-secrets
  erlang-cookie: "CHANGE_ME_SUPER_SECRET_COOKIE"
  node-key: "CHANGE_ME_NODE_PRIVATE_KEY"
  jwt-secret: "CHANGE_ME_JWT_SECRET_FOR_ENGINE_API"
  # Layer 2 credentials
  optimism-api-key: "CHANGE_ME_OPTIMISM_API_KEY"
  arbitrum-api-key: "CHANGE_ME_ARBITRUM_API_KEY"
  zksync-api-key: "CHANGE_ME_ZKSYNC_API_KEY"
  # Monitoring credentials
  grafana-admin-password: "CHANGE_ME_GRAFANA_PASSWORD"
  slack-webhook-url: "CHANGE_ME_SLACK_WEBHOOK"
  pagerduty-service-key: "CHANGE_ME_PAGERDUTY_KEY"