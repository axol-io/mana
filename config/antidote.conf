# AntidoteDB Production Configuration for High Performance
# Optimized for 7.45M operations per second target

## Core Settings
{platform_data_dir, "/opt/antidote/data"}.
{platform_log_dir, "/opt/antidote/log"}.

## Performance Optimizations
{riak_core, [
    {ring_size, 64},                    % Optimized ring size for 3-node cluster
    {handoff_concurrency, 4},          % Concurrent handoffs for faster rebalancing
    {vnode_management_timer, 1000},    % Faster vnode management
    {wants_claim_fun, {riak_core_claim, wants_claim_v2}},
    {choose_claim_fun, {riak_core_claim, choose_claim_v2}},
    {target_n_val, 3}                  % Full replication across 3 nodes
]}.

## Storage Engine Tuning
{riak_kv, [
    {storage_backend, riak_kv_eleveldb_backend},
    {anti_entropy, {on, []}},
    {anti_entropy_build_limit, {100, 1000}},
    {anti_entropy_expire, 604800000},   % 7 days
    {anti_entropy_concurrency, 2},
    {bucket_props, [
        {n_val, 3},                     % 3 replicas
        {r, 1},                         % Read from 1 replica (fast reads)
        {w, 1},                         % Write to 1 replica (fast writes) 
        {pr, 0},                        % No primary read requirement
        {pw, 0},                        % No primary write requirement
        {allow_mult, true}              % Allow concurrent updates
    ]}
]}.

## LevelDB Performance Tuning
{eleveldb, [
    {total_leveldb_mem_percent, 70},    % Use 70% of available memory
    {sync, false},                      % Async writes for maximum performance
    {limited_developer_mem, false},
    {write_buffer_size, 134217728},     % 128MB write buffers
    {max_open_files, 5000},            % Allow more open files
    {block_cache_size, 268435456},     % 256MB block cache
    {use_bloomfilter, true},           % Enable bloom filters
    {compression, lz4},                % Fast LZ4 compression
    {block_restart_interval, 16},
    {block_size, 65536},               % 64KB blocks
    {max_file_size, 134217728}         % 128MB max file size
]}.

## Network Optimization
{kernel, [
    {inet_dist_listen_min, 9000},
    {inet_dist_listen_max, 9020},
    {net_ticktime, 10},                % Faster network tick time
    {inet_default_connect_options, [
        {nodelay, true},               % Disable Nagle algorithm
        {send_timeout, 30000},
        {send_timeout_close, true}
    ]},
    {inet_default_listen_options, [
        {nodelay, true},
        {reuseaddr, true},
        {backlog, 1024}                % Larger connection backlog
    ]}
]}.

## Memory Management
{vm_args, [
    "+P 1048576",                      % Max processes
    "+Q 1048576",                      % Max ports
    "+zdbbl 32768",                    % Distribution buffer busy limit
    "+sbwt very_short",                % Scheduler bind type
    "+swt very_low",                   % Scheduler wakeup threshold
    "+sws legacy"                      % Scheduler wakeup strategy
]}.

## Transaction Log Optimization
{antidote, [
    {txn_log_timeout, 1000},          % 1 second log timeout
    {log_batch_size, 1000},           % Batch 1000 operations
    {enable_logging, true},
    {recover_from_log, true},
    {auto_start_read_servers, true},
    {load_data, false}
]}.

## Inter-DC Replication (disabled for single cluster)
{inter_dc, [
    {enable_replication, false}
]}.

## HTTP API Settings
{ranch, [
    {max_connections, 10000}           % Support up to 10k concurrent connections
]}.

## Monitoring and Logging
{lager, [
    {handlers, [
        {lager_console_backend, info},
        {lager_file_backend, [
            {file, "/opt/antidote/log/error.log"},
            {level, error},
            {size, 104857600},         % 100MB log files
            {date, "$D0"},
            {count, 10}
        ]},
        {lager_file_backend, [
            {file, "/opt/antidote/log/console.log"},
            {level, info},
            {size, 104857600},
            {date, "$D0"},
            {count, 5}
        ]}
    ]},
    {error_logger_redirect, true},
    {crash_log, "/opt/antidote/log/crash.log"}
]}.

## Folsom Metrics
{folsom, [
    {counter, [
        antidote_operations_total,
        antidote_errors_total,
        antidote_transactions_total
    ]},
    {histogram, [
        antidote_operation_duration,
        antidote_transaction_duration,
        antidote_commit_duration
    ]}
]}.

## GC Tuning for Low Latency
{erts, [
    {+hms, 8192},                      % Initial heap size
    {+hmbs, 8192},                     % Initial binary heap size  
    {+zdbbl, 32768}                    % Distribution buffer busy limit
]}.