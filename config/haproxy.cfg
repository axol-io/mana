# HAProxy Configuration for AntidoteDB Load Balancing
# Optimized for high throughput and low latency

global
    maxconn 50000
    log stdout local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Performance tuning
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    tune.maxrewrite 8192

defaults
    mode tcp
    log global
    option dontlognull
    option tcplog
    option tcp-smart-accept
    option tcp-smart-connect
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout check 5s
    
    # Performance optimizations
    option splice-auto
    option splice-request
    option splice-response

# Statistics page
frontend stats
    bind *:8080
    mode http
    stats enable
    stats uri /
    stats realm HAProxy\ Statistics
    stats auth admin:antidote-cluster
    stats refresh 30s
    stats show-node
    stats show-legends

# AntidoteDB Client API Load Balancer
frontend antidote_frontend
    bind *:8087
    mode tcp
    default_backend antidote_cluster

backend antidote_cluster
    mode tcp
    balance roundrobin
    
    # Health checking
    option tcp-check
    tcp-check connect
    
    # AntidoteDB nodes
    server antidote1 antidote1:8087 check inter 5s fastinter 1s downinter 3s rise 2 fall 3 maxconn 16384 weight 100
    server antidote2 antidote2:8087 check inter 5s fastinter 1s downinter 3s rise 2 fall 3 maxconn 16384 weight 100  
    server antidote3 antidote3:8087 check inter 5s fastinter 1s downinter 3s rise 2 fall 3 maxconn 16384 weight 100

# HTTP API Load Balancer (for management)
frontend antidote_http_frontend
    bind *:8080
    mode http
    default_backend antidote_http_cluster

backend antidote_http_cluster
    mode http
    balance roundrobin
    
    # Health checking
    option httpchk GET /health
    http-check expect status 200
    
    # AntidoteDB HTTP endpoints
    server antidote1-http antidote1:8080 check inter 10s fastinter 2s downinter 5s rise 2 fall 3 maxconn 1000 weight 100
    server antidote2-http antidote2:8080 check inter 10s fastinter 2s downinter 5s rise 2 fall 3 maxconn 1000 weight 100
    server antidote3-http antidote3:8080 check inter 10s fastinter 2s downinter 5s rise 2 fall 3 maxconn 1000 weight 100