global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'mana-alerts@ethereum.local'
  
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
    group_wait: 0s
    repeat_interval: 5m
  - match:
      severity: warning
    receiver: 'warning-alerts'
    repeat_interval: 15m
  - match:
      service: mana-ultra-performance
    receiver: 'performance-alerts'
    repeat_interval: 2m

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://localhost:5001/webhook'

- name: 'critical-alerts'
  webhook_configs:
  - url: 'http://localhost:5001/webhook/critical'
    send_resolved: true
  slack_configs:
  - api_url: 'YOUR_SLACK_WEBHOOK_URL_HERE'
    channel: '#mana-critical'
    title: 'Mana Critical Alert - {{ .GroupLabels.alertname }}'
    text: |
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      *Severity:* {{ .Labels.severity }}
      *Environment:* {{ .Labels.environment }}
      *Instance:* {{ .Labels.instance }}
      {{ end }}

- name: 'warning-alerts'  
  webhook_configs:
  - url: 'http://localhost:5001/webhook/warning'
    send_resolved: true
  slack_configs:
  - api_url: 'YOUR_SLACK_WEBHOOK_URL_HERE'
    channel: '#mana-warnings'
    title: 'Mana Warning - {{ .GroupLabels.alertname }}'
    text: |
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      *Instance:* {{ .Labels.instance }}
      {{ end }}

- name: 'performance-alerts'
  webhook_configs:
  - url: 'http://localhost:5001/webhook/performance'
    send_resolved: true
  slack_configs:
  - api_url: 'YOUR_SLACK_WEBHOOK_URL_HERE'
    channel: '#mana-performance'
    title: 'Mana Performance Alert - {{ .GroupLabels.alertname }}'
    text: |
      {{ range .Alerts }}
      *Performance Issue:* {{ .Annotations.summary }}
      *Details:* {{ .Annotations.description }}
      *Current Value:* {{ .Annotations.current_value }}
      *Threshold:* {{ .Annotations.threshold }}
      *Instance:* {{ .Labels.instance }}
      {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']